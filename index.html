<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Discord Account Manager</title>
  <link rel="stylesheet" href="src/styles/layout.css">
  <link rel="stylesheet" href="src/styles/titlebar.css">
  <link rel="stylesheet" href="src/styles/components.css">
  <link rel="stylesheet" href="src/styles/history.css">
  <link rel="stylesheet" href="src/styles/managers.css">
  <link rel="stylesheet" href="src/styles/icons.css">
  <link rel="stylesheet" href="src/styles/features.css">
  <link rel="stylesheet" href="src/styles/voice.css">
  <link rel="stylesheet" href="src/styles/truestudio.css">
</head>
<body>
  <div class="bg-orbs">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>
  </div>
  <div class="snow" aria-hidden="true">
    <span style="left:5%;animation-duration:14s;animation-delay:-2s;width:4px;height:4px"></span>
    <span style="left:11%;animation-duration:18s;animation-delay:-7s;width:6px;height:6px"></span>
    <span style="left:17%;animation-duration:22s;animation-delay:-1s;width:3px;height:3px;opacity:.8"></span>
    <span style="left:23%;animation-duration:16s;animation-delay:-9s;width:5px;height:5px"></span>
    <span style="left:29%;animation-duration:20s;animation-delay:-4s;width:4px;height:4px"></span>
    <span style="left:35%;animation-duration:24s;animation-delay:-12s;width:7px;height:7px"></span>
    <span style="left:41%;animation-duration:15s;animation-delay:-3s;width:3px;height:3px"></span>
    <span style="left:47%;animation-duration:19s;animation-delay:-8s;width:5px;height:5px"></span>
    <span style="left:53%;animation-duration:23s;animation-delay:-5s;width:4px;height:4px"></span>
    <span style="left:59%;animation-duration:17s;animation-delay:-11s;width:6px;height:6px"></span>
    <span style="left:65%;animation-duration:21s;animation-delay:-2s;width:3px;height:3px"></span>
    <span style="left:71%;animation-duration:13s;animation-delay:-6s;width:5px;height:5px"></span>
    <span style="left:77%;animation-duration:25s;animation-delay:-10s;width:4px;height:4px"></span>
    <span style="left:83%;animation-duration:18s;animation-delay:-3s;width:6px;height:6px"></span>
    <span style="left:89%;animation-duration:20s;animation-delay:-7s;width:3px;height:3px"></span>
    <span style="left:95%;animation-duration:16s;animation-delay:-13s;width:5px;height:5px"></span>
    <span style="left:8%;animation-duration:26s;animation-delay:-15s;width:4px;height:4px"></span>
    <span style="left:32%;animation-duration:14s;animation-delay:-9s;width:5px;height:5px"></span>
    <span style="left:56%;animation-duration:22s;animation-delay:-4s;width:3px;height:3px"></span>
    <span style="left:74%;animation-duration:19s;animation-delay:-11s;width:6px;height:6px"></span>
  </div>

  <div class="app-container">
    <div class="title-bar">
      <button class="nav-toggle-btn" id="navToggleBtn" title="Menu" aria-label="menu">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>
      <div class="title">
        <span class="title-dot"></span>
        <span data-i18n="app.title">Discord Account Manager</span>
        <span class="title-handle">@4_3a</span>
      </div>
      <div class="window-controls">
        <!-- Header user chip — populated from /api/me -->
        <div class="header-user" id="headerUser" hidden>
          <img class="header-user-avatar" id="headerUserAvatar" alt="" src="">
          <span class="header-user-name" id="headerUserName">—</span>
        </div>
        <button class="lang-toggle-btn" id="langToggleBtn" data-i18n-title="app.lang" title="Language">العربية</button>
        <button class="theme-toggle-btn" id="themeToggleBtn" data-i18n-title="app.theme" title="Toggle theme" aria-label="Toggle theme"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
        <button class="lang-toggle-btn" id="changePwBtn" title="Change password" aria-label="Change password" style="padding:6px 10px"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></button>
        <button class="lang-toggle-btn" id="logoutBtn" title="Sign out" aria-label="Sign out" style="padding:6px 10px"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
        <button class="info-button" id="infoBtn" data-i18n-title="app.about" title="About">
          <svg viewBox="0 0 24 24" width="16" height="16">
            <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
          </svg>
        </button>
        <button id="minimizeBtn" style="display:none"></button>
        <button id="maximizeBtn" style="display:none"></button>
        <button id="closeBtn" style="display:none"></button>
      </div>
    </div>

    <div class="main-wrapper">
      <nav class="nav-sidebar" id="navSidebar">
        <div class="nav-items">
          <div class="nav-item active" data-page="login" id="loginNavItem">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M13 12H3"/>
              </svg>
            </span>
            <span data-i18n="nav.login">Login</span>
          </div>

          <div class="nav-item hidden" data-page="tokens">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
              </svg>
            </span>
            <span data-i18n="nav.tokens">Tokens</span>
          </div>

          <div class="nav-item hidden" data-page="friends">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
              </svg>
            </span>
            <span data-i18n="nav.friends">Friends</span>
          </div>

          <div class="nav-item hidden" data-page="servers">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <path d="M3 9h18M9 21V9"/>
              </svg>
            </span>
            <span data-i18n="nav.servers">Servers</span>
          </div>

          <div class="nav-item hidden" data-page="dms">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              </svg>
            </span>
            <span data-i18n="nav.dms">DMs</span>
          </div>

          <div class="nav-item hidden" data-page="private">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
              </svg>
            </span>
            <span data-i18n="nav.private">Private</span>
          </div>

          <div class="nav-item hidden" data-page="groups">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
              </svg>
            </span>
            <span data-i18n="nav.groups">Groups</span>
          </div>

          <div class="nav-item hidden" data-page="messages">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
              </svg>
            </span>
            <span data-i18n="nav.messages">Messages</span>
          </div>

          <div class="nav-item hidden" data-page="reactions">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
              </svg>
            </span>
            <span data-i18n="nav.reactions">Reactions</span>
          </div>

          <div class="nav-item hidden" data-page="history">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="12 8 12 12 14 14"/>
                <path d="M3.05 11a9 9 0 1 0 .5-4.5"/>
                <polyline points="3 3 3 7 7 7"/>
              </svg>
            </span>
            <span data-i18n="nav.history">Old Manager</span>
          </div>

          <div class="nav-item hidden" data-page="lookup">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
            </span>
            <span data-i18n="nav.lookup">Server Lookup</span>
          </div>

          <div class="nav-item hidden" data-page="ts">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2 4 6v6c0 5 3.5 9 8 10 4.5-1 8-5 8-10V6l-8-4z"/>
                <path d="M9 12l2 2 4-4"/>
              </svg>
            </span>
            <span data-i18n="nav.ts">Bot-Studio</span>
          </div>

          <div class="nav-item hidden" data-page="voice">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="23"/>
                <line x1="8" y1="23" x2="16" y2="23"/>
              </svg>
            </span>
            <span>Voice</span>
          </div>

        </div>

        <div class="user-profile" id="userProfile">
          <img class="user-avatar-img" id="userAvatarImg" src="/discord.png" alt="" style="display:none">
          <div class="user-avatar" id="userAvatar"><span id="userInitial"></span></div>
          <div class="user-info">
            <div class="user-name" id="userName"></div>
          </div>
          <button class="disconnect-btn" id="disconnectBtn" data-i18n="app.disconnect">Disconnect</button>
        </div>
      </nav>
      <div class="nav-backdrop" id="navBackdrop"></div>

      <div class="main-content">
        <div class="page-container active" id="login-page">
          <div class="lux-login">
            <div class="lux-orb lux-orb-a"></div>
            <div class="lux-orb lux-orb-b"></div>
            <div class="lux-orb lux-orb-c"></div>

            <div class="lux-card">
              <div class="lux-logo-wrap">
                <div class="lux-logo-glow"></div>
                <img src="/discord.png" alt="Discord" class="lux-logo" onerror="this.style.display='none'">
              </div>

              <h1 class="lux-title" data-i18n="app.welcome">Welcome Back</h1>
              <p class="lux-sub" data-i18n="lg.tagline">Discord Account Manager — by Ahmed @4_3a</p>

              <div class="input-group">
                <input type="password" id="tokenInput" data-i18n-placeholder="app.token_placeholder" placeholder="Enter your Discord token">
              </div>
              <div class="button-group">
                <button id="connectBtn">
                  <span class="btn-text" data-i18n="app.connect">Connect</span>
                  <div class="loader" style="display: none;"></div>
                </button>
                <button id="saveTokenBtn" class="secondary" data-i18n="app.save_token">Save Token</button>
              </div>
              <div id="status"></div>
              <div class="token-management" id="tokenManagement"></div>

              <div class="lux-links">
                <a class="lux-link lux-link-support" href="https://discord.gg/ens" target="_blank" rel="noopener">
                  <div class="lux-link-icon">
                    <svg viewBox="0 0 71 55" fill="currentColor"><path d="M60.1 4.9A58.5 58.5 0 0 0 45.6.4a44 44 0 0 0-1.9 3.9 54 54 0 0 0-16.2 0A45 45 0 0 0 25.6.4 58 58 0 0 0 11 4.9C2 18.4-.5 31.6.7 44.6a58.7 58.7 0 0 0 17.9 9.1c1.4-2 2.7-4.1 3.8-6.3-2.1-.8-4.1-1.8-6-2.9.5-.4 1-.8 1.5-1.2a41.9 41.9 0 0 0 35.9 0l1.5 1.2a37 37 0 0 1-6 2.9c1.1 2.2 2.4 4.3 3.8 6.3a58.6 58.6 0 0 0 17.9-9.2c1.6-15.1-2.4-28.2-10.9-39.6zM23.7 36.7c-3.5 0-6.4-3.3-6.4-7.3s2.8-7.3 6.4-7.3 6.5 3.3 6.4 7.3c0 4-2.8 7.3-6.4 7.3zm23.6 0c-3.5 0-6.4-3.3-6.4-7.3s2.8-7.3 6.4-7.3 6.5 3.3 6.4 7.3c0 4-2.8 7.3-6.4 7.3z"/></svg>
                  </div>
                  <div class="lux-link-text">
                    <div class="lux-link-title" data-i18n="lg.support_title">Join Support Server</div>
                    <div class="lux-link-sub">discord.gg/ens</div>
                  </div>
                  <div class="lux-link-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                  </div>
                </a>

                <a class="lux-link lux-link-ig" href="https://instagram.com/a_13qn" target="_blank" rel="noopener">
                  <div class="lux-link-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
                  </div>
                  <div class="lux-link-text">
                    <div class="lux-link-title" data-i18n="lg.ig_title">Follow on Instagram</div>
                    <div class="lux-link-sub">@a_13qn</div>
                  </div>
                  <div class="lux-link-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                  </div>
                </a>
              </div>
            </div>
          </div>
        </div>

        <div class="page-container" id="tokens-page"></div>
        <div class="page-container" id="friends-page"></div>
        <div class="page-container" id="servers-page"></div>
        <div class="page-container" id="dms-page"></div>
        <div class="page-container" id="groups-page"></div>
        <div class="page-container" id="messages-page"></div>
        <div class="page-container" id="reactions-page"></div>
        <div class="page-container" id="history-page"></div>
        <div class="page-container" id="private-page"></div>
        <div class="page-container" id="stats-page"></div>
        <div class="page-container" id="lookup-page"></div>
        <div class="page-container" id="clone-page"></div>
        <div class="page-container" id="historylog-page"></div>
        <div class="page-container" id="tokenhealth-page"></div>
        <div class="page-container" id="mentions-page"></div>
        <div class="page-container" id="pic-page"></div>
        <div class="page-container" id="antiprune-page"></div>
        <div class="page-container" id="search-page"></div>
        <div class="page-container" id="massfriend-page"></div>
        <div class="page-container" id="ts-page"></div>
        <div class="page-container" id="voice-page"></div>
      </div>
    </div>
  </div>

  <div class="watermark">AHMED</div>

  <script src="src/api.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
